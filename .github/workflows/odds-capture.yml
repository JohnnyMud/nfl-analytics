# Free-tier odds capture (~100–140 slate polls/month → ~300–420 credits at 3/call).
#
# Strategy: sparse baseline all week, denser only near typical NFL kickoff windows.
# Cron wakes the process; the orchestrator still skips fixtures that are not due.
# Requires repo secrets: ODDS_API_KEY, DATABASE_URL (hosted Postgres — Actions
# runners are ephemeral and cannot keep a compose DB between runs).
#
# All times UTC. Rough US mapping:
#   Thu 22:00–Fri 01:00  → Thursday Night Football
#   Sun 16:00–23:00      → Sunday afternoon / late window
#   Mon 00:00–02:00      → Sunday Night Football spill

name: Odds capture

on:
  schedule:
    # Sparse baseline: 3×/day every day
    - cron: "5 2,10,18 * * *"
    # Thursday Night denser
    - cron: "5 22,23 * * 4"
    - cron: "5 0,1 * * 5"
    # Sunday slate denser (18:05 already covered by baseline)
    - cron: "5 16,20,22 * * 0"
    # SNF / late window into Monday UTC
    - cron: "5 0 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only (no odds fetch, no writes)"
        type: boolean
        default: false

concurrency:
  group: odds-capture
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      # Free-tier: stretch intervals so denser cron windows cannot over-poll.
      ODDS_COARSE_INTERVAL_SECONDS: "21600" # 6h
      ODDS_MEDIUM_INTERVAL_SECONDS: "3600" # 1h
      ODDS_FINE_INTERVAL_SECONDS: "3600" # treat fine like medium
      ODDS_MONTHLY_CREDIT_BUDGET: "500"
      ODDS_COARSEN_BUDGET_FRACTION: "0.30"
    steps:
      - name: Require secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing" >&2
            exit 1
          fi
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY secret is missing" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Migrate
        run: python -m alembic upgrade head

      - name: Capture tick
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m ingest.odds tick --dry-run
          else
            python -m ingest.odds tick
          fi
